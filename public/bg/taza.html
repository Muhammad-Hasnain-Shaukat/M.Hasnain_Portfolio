<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"breath":1,"size":70,"handle":1};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const breath = addControl("breath", "Breathing Speed", 0, 3, 1.0);
                 const size = addControl("size", "Cup Size", 40, 120, 70);
                 const handle = addControl("handle", "Handle Size", 0.5, 1.5, 1.0);
                 
                 const N = count;
                 
                 const nBody = Math.floor(N * 0.65);
                 const nRim = Math.floor(N * 0.10);
                 const nHandle = Math.floor(N * 0.20);
                 const nCoffee = Math.floor(N * 0.04);
                 const nSteam = Math.floor(N * 0.01);
                 
                 const breathFactor = 1 + 0.04 * Math.sin(time * breath);
                 
                 let px = 0, py = 0, pz = 0;
                 let particleType = 0;
                 
                 const GOLDEN = Math.PI * (3 - Math.sqrt(5));
                 
                 if (i < nBody) {
                 
                   // CUERPO DE LA TAZA
                   const f = (i + 0.5) / nBody;
                 
                   const y = (f - 0.5) * size * 1.25;
                   const radius = size * (0.68 + 0.08 * (y / size + 0.5));
                 
                   const angle = i * GOLDEN;
                   const r = radius * Math.sqrt((i % 1000) / 1000);
                 
                   px = Math.cos(angle) * r;
                   py = y * breathFactor;
                   pz = Math.sin(angle) * r;
                 
                   particleType = 0;
                 
                 } else if (i < nBody + nRim) {
                 
                   // BORDE SUPERIOR
                   const j = i - nBody;
                   const f = j / nRim;
                   const angle = f * Math.PI * 2;
                 
                   const radius = size * 0.75;
                 
                   px = Math.cos(angle) * radius;
                   py = size * 0.65;
                   pz = Math.sin(angle) * radius;
                 
                   particleType = 0;
                 
                 } else if (i < nBody + nRim + nHandle) {
                 
                   // MANGO ROJO
                   const j = i - nBody - nRim;
                   const f = j / nHandle;
                 
                   const angle = -Math.PI * 0.85 + f * Math.PI * 1.7;
                 
                   const centerX = size * 0.72;
                   const centerY = 0;
                   const handleRadius = size * 0.48 * handle;
                 
                   px = centerX + Math.cos(angle) * handleRadius;
                   py = centerY + Math.sin(angle) * handleRadius;
                   pz = 0;
                 
                   // Grosor del mango
                   const thickness = size * 0.10;
                   const offset = ((j * 17) % 100) / 100;
                 
                   px += Math.cos(angle) * thickness * offset;
                   py += Math.sin(angle) * thickness * offset;
                 
                   particleType = 1;
                 
                 } else if (i < nBody + nRim + nHandle + nCoffee) {
                 
                   // CAFÉ
                   const j = i - nBody - nRim - nHandle;
                   const f = j / nCoffee;
                 
                   const angle = j * GOLDEN;
                   const radius = size * 0.58 * Math.sqrt(f);
                 
                   px = Math.cos(angle) * radius;
                   py = size * 0.66;
                   pz = Math.sin(angle) * radius;
                 
                   particleType = 2;
                 
                 } else {
                 
                   // VAPOR
                   const j = i - nBody - nRim - nHandle - nCoffee;
                   const f = j / Math.max(1, nSteam);
                 
                   const angle = j * 2.4;
                 
                   px = Math.sin(time * 0.8 + angle) * size * 0.18;
                   py = size * 0.7 + f * size * 0.9;
                   pz = Math.cos(time * 0.6 + angle) * size * 0.12;
                 
                   particleType = 3;
                 }
                 
                 target.set(px, py, pz);
                 
                 
                 // COLORES
                 if (particleType === 1) {
                 
                   // MANGO ROJO
                   color.setHSL(0.0, 0.95, 0.52);
                 
                 } else if (particleType === 2) {
                 
                   // CAFÉ
                   color.setHSL(0.07, 0.75, 0.22);
                 
                 } else if (particleType === 3) {
                 
                   // VAPOR
                   color.setHSL(0.0, 0.0, 0.85);
                 
                 } else {
                 
                   // CUERPO BLANCO
                   color.setHSL(0.0, 0.05, 0.92);
                 }
                 
                 
                 // INFORMACIÓN
                 if (i === 0) {
                   setInfo("Red Cup", "Cute particle cup with a red handle.");
                   annotate(
                     "cup_core",
                     new THREE.Vector3(0, 0, 0),
                     "Cup"
                   );
                 }
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
